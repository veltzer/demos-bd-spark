# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "demos-bd-spark"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "faker",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "pyspark",
    "streamlit",
    "wurlitzer",
]

[dependency-groups]
dev = [
    "pandas-stubs",
    "pyrefly",
    "pytest",
    "ruff",
    "types-wurlitzer",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor). preset = "legacy" is
# pyrefly's mypy-compatible behavior; "." on the search path is mypy's
# implicit current directory.
preset = "legacy"
search-path = [
    "scripts",
    ".",
]
# Third-party libraries without type information.
ignore-missing-imports = [
    "matplotlib.*",
    "pandas.*",
    "plotly.*",
]
