# rsconstruct build configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["docs", "exercises"]
src_files = ["README.md"]

[processor.zspell]
src_dirs = ["docs", "exercises"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts", "config", "exercises"]

[processor.pylint]
src_dirs = ["scripts", "config", "exercises"]

[processor.mypy]
src_dirs = ["scripts", "config", "exercises"]
batch = false
# With batch = false many mypy processes run concurrently and share
# .mypy_cache; pyspark drags in google-namespace packages whose cache entries
# mypy mishandles under that race ("AssertionError: Cannot find module for
# google"). No cache: every file is still fully checked, just without the
# shared incremental state.
args = ["--no-incremental", "--cache-dir=/dev/null"]

[processor.shellcheck]
src_dirs = ["scripts", "exercises", "docs", "config"]
src_files = [".auto.enter.sh", ".auto.exit.sh"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.xmllint]
src_dirs = ["exercises/scala/03_manipulate_csv_interactively/spark_job"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.eslint]
src_dirs = ["exercises/pyspark/06_processing_text_files"]
args = ["-c", ".eslint.config.js"]
