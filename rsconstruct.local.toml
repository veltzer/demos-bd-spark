# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# README.md renders from tera.templates/README.md.tera, loading config/*.lua
# with load_lua (the pyanyzip pattern). The pydmt mako templates are gone.
[processor.tera]
src_dirs = ["tera.templates"]

# Every exercise deliberately carries the same file name (solution.py /
# app.py) so the material reads uniformly. Batched mypy maps same-named files
# to one module and fails with "Duplicate module" whenever they share an
# invocation. batch = false checks every file in its own invocation: same
# checks, no shared namespace. The exercise directories cannot become
# packages (names like 02_hello are not valid identifiers).
[processor.mypy]
batch = false
# With batch = false many mypy processes run concurrently and share
# .mypy_cache; pyspark drags in google-namespace packages whose cache entries
# mypy mishandles under that race ("AssertionError: Cannot find module for
# google"). No cache: every file is still fully checked, just without the
# shared incremental state.
args = ["--no-incremental", "--cache-dir=/dev/null"]

# Runtime deps so CI installs what the code imports (pylint/mypy resolve
# them) -- the demos-cloud-aws pattern.
[dependencies]
pip = [
    "faker",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "plotly-stubs",
    "pyspark",
    "streamlit",
    "types-wurlitzer",
    "wurlitzer",
]
